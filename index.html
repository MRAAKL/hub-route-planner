<title>Route Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: app window on a faint grid. Left rail (workspace, steps, customers), centre work area with tabs, right rail of Claude's notes. */
:root{
  --page:#EEEDE9; --grid:#E4E3DE; --bg:#FBFAF8; --side:#F6F5F1; --card:#FFFFFF; --line:#E7E5DF; --line2:#D9D7D0;
  --ink:#1B1B1A; --muted:#8B8A84; --muted2:#63625D;
  --accent:#D3A468; --accent-soft:#F6EAD7; --accent-ink:#8A5E21;
  --btn:#1B1B1A; --on-btn:#FFFFFF; --chip:#F0EFEB;
  --ok:#3C7A4C; --ok-bg:#E4F0E7; --bad:#B03A2C; --bad-bg:#F7E1DD; --info:#4A5A72; --info-bg:#E9EDF3;
  --shadow:0 1px 2px rgba(20,20,10,.06),0 12px 40px rgba(20,20,10,.08);
  --f:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'Geist Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0D0D0C; --grid:#171716; --bg:#151514; --side:#1A1A19; --card:#1E1E1C; --line:#2C2B29; --line2:#3A3936;
  --ink:#EEEDE9; --muted:#8E8D87; --muted2:#B2B1AA;
  --accent:#DDB077; --accent-soft:#3B2F1E; --accent-ink:#E6BE86;
  --btn:#EEEDE9; --on-btn:#151514; --chip:#2A2927;
  --ok:#86CC96; --ok-bg:#1B3224; --bad:#F29389; --bad-bg:#3C1E1B; --info:#9DB6DA; --info-bg:#1E2A3C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 40px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0D0D0C; --grid:#171716; --bg:#151514; --side:#1A1A19; --card:#1E1E1C; --line:#2C2B29; --line2:#3A3936;
  --ink:#EEEDE9; --muted:#8E8D87; --muted2:#B2B1AA;
  --accent:#DDB077; --accent-soft:#3B2F1E; --accent-ink:#E6BE86;
  --btn:#EEEDE9; --on-btn:#151514; --chip:#2A2927;
  --ok:#86CC96; --ok-bg:#1B3224; --bad:#F29389; --bad-bg:#3C1E1B; --info:#9DB6DA; --info-bg:#1E2A3C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 40px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--f);font-size:13.5px;line-height:1.45;padding:0}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.announce{background:#111;color:#fff;text-align:center;padding:12px 16px;font-size:13px;letter-spacing:.01em}
.announce span{opacity:.6;margin-left:8px}
.stage{padding:24px 16px 40px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;min-height:100%}
.app{max-width:1440px;margin:0 auto;background:var(--bg);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);display:grid;grid-template-columns:236px minmax(0,1fr) 330px;overflow:hidden;min-height:760px}
@media (max-width:1180px){.app{grid-template-columns:220px minmax(0,1fr)}.assist{grid-column:1/-1;border-left:0!important;border-top:1px solid var(--line)}}
@media (max-width:820px){.app{grid-template-columns:minmax(0,1fr)}.app>.side{display:none}}
.side{background:var(--side);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ws{display:flex;align-items:center;gap:8px;padding:6px 8px 12px;font-weight:600}
.logo{width:22px;height:22px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.navhead{font-size:11.5px;color:var(--muted);padding:14px 8px 4px}
.nav{appearance:none;border:0;background:transparent;color:var(--muted2);display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 8px;border-radius:7px;font-size:13px;cursor:pointer}
.nav:hover:not([disabled]){background:var(--chip);color:var(--ink)}
.nav.on{background:var(--chip);color:var(--ink);font-weight:500}
.nav[disabled]{opacity:.5;cursor:not-allowed}
.nav svg{flex:none;width:15px;height:15px}
.nav .r{margin-left:auto;font-size:11.5px;color:var(--muted)}
.cust{display:flex;align-items:center;gap:9px;padding:6px 8px;color:var(--muted2);font-size:13px}
.cust .dot{width:7px;height:7px;border-radius:50%;background:var(--line2);flex:none}
.cust .dot.ok{background:var(--ok)}
.cust .r{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
.sidefoot{margin-top:auto;padding:12px 8px 2px;font-size:11.5px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px 18px;border-bottom:1px solid var(--line)}
.crumb{display:flex;gap:8px;align-items:baseline;color:var(--muted2);font-size:13px}
.crumb b{color:var(--ink);font-weight:500}
.crumb .sep{color:var(--line2)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);padding:12px 8px;font-size:14px;font-weight:500;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab[disabled]{opacity:.45;cursor:not-allowed}
.tab svg{width:16px;height:16px}
.work{padding:18px;display:grid;gap:14px;align-content:start}
.btn{appearance:none;font:500 13px var(--f);padding:8px 14px;border-radius:9px;border:1px solid var(--btn);background:var(--btn);color:var(--on-btn);cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line2)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:hover:not([disabled]){opacity:.88}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:0}
.card>.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);font-weight:500}
.card>.ch small{font-weight:400;color:var(--muted);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi .kb{padding:14px 14px 16px;text-align:center;display:grid;gap:6px;justify-items:center}
.kpi .kb b{font-size:34px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--chip);color:var(--muted2)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--accent-soft);color:var(--accent-ink)} .pill.info{background:var(--info-bg);color:var(--info)}
.bar{height:4px;background:var(--line);border-radius:3px;width:100%;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.scroll{overflow:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-weight:500;font-size:12px;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child>td{border-bottom:0}
td.num,th.num{text-align:right}
tr.flag>td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.det td{background:var(--bg);padding:14px}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)} .sub{font-size:12px;color:var(--muted)}
.nm{font-weight:500}
.chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:6px;white-space:nowrap;margin:1px 4px 1px 0;border:0;background:var(--chip);color:var(--muted2)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--accent-soft);color:var(--accent-ink)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.info{background:var(--info-bg);color:var(--info)}
.chip.btn{cursor:pointer;font-weight:500;box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft);color:var(--accent-ink);padding:2px 8px;font-family:inherit}
.link{appearance:none;border:0;background:none;color:var(--muted2);font:inherit;font-size:12px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
select,input[type=text]{font:400 12.5px var(--f);color:var(--ink);background:var(--card);border:1px solid var(--line2);border-radius:7px;padding:5px 8px;max-width:100%}
input[type=text]{width:100%}
.route .rh{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.rt{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;min-width:0}
.rid{font-size:15px;font-weight:600}
.area{color:var(--muted2)}
.rmeta{display:flex;flex-wrap:wrap;gap:2px 16px;font-size:12.5px;color:var(--muted2)}
.rmeta b{color:var(--ink);font-weight:500}
.route.done{border-color:var(--ok)}
.route .rf{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line)}
.why{display:flex;flex-wrap:wrap;gap:2px;min-width:0}
.det .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.det h3{font-size:12px;font-weight:500;color:var(--muted);margin:0 0 4px}
.det p{margin:0 0 6px}
.det .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.det label{display:flex;gap:6px;align-items:flex-start;margin-bottom:4px;cursor:pointer}
.ord td,.ord th{font-size:12px;padding:5px 8px}
.drop{border:1.5px dashed var(--line2);border-radius:12px;background:var(--card);padding:34px 16px;text-align:center;display:grid;gap:12px;justify-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop h2{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
.drop p{margin:0;max-width:58ch;color:var(--muted2)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.files{display:grid;gap:10px}
.file{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start}
.file.bad{border-color:var(--bad)}
.file .fn{font-weight:500;overflow-wrap:anywhere}
.file .d2{grid-column:1/-1;font-size:12.5px;color:var(--muted2)}
.ready{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.visually{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.assist{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;background:var(--card)}
.assist .ah{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:500;display:flex;justify-content:space-between;gap:8px}
.assist .ah small{font-weight:400;color:var(--muted)}
.feed{padding:14px 16px;display:grid;gap:12px;align-content:start;flex:1;max-height:760px;overflow:auto}
.msg{color:var(--ink);line-height:1.5}
.msg .t{margin:0}
.acts2{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-top:6px}
.act{appearance:none;border:0;background:var(--chip);color:var(--ink);border-radius:10px;padding:7px 11px;font-size:12.5px;cursor:pointer}
.act:hover{background:var(--line)}
.ask{margin:12px 14px 14px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:12.5px}
.ask b{display:block;font-weight:400;color:var(--muted);opacity:.8}
.done-msg{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:10px 14px;font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--btn);color:var(--on-btn);padding:8px 14px;border-radius:9px;font-size:13px;z-index:5}

.nw{white-space:nowrap}.tb{padding:10px 14px;border-bottom:1px solid var(--line)}
.drop.slim{padding:20px 16px;gap:8px}.drop.slim h2{font-size:17px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.vt{display:flex;flex-direction:column;overflow:hidden}
.vph{height:84px;background:var(--chip);display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}
.vph:has(img){height:150px}.vph img{width:100%;height:100%;object-fit:cover}
.phbtn{appearance:none;border:1px dashed var(--line2);background:transparent;color:var(--muted2);border-radius:9px;padding:8px 12px;display:flex;gap:6px;align-items:center;font-size:12.5px;cursor:pointer}
.phbtn svg{width:14px;height:14px}
.vb{padding:12px 14px;display:grid;gap:6px;align-content:start}
.vh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px}
.vnum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0}
.vnum div{display:grid;gap:1px}.vnum b{font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
.vp{margin:0;font-size:12.5px}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;padding:12px 14px}
.seg{appearance:none;text-align:left;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;display:grid;gap:4px;cursor:pointer;font-family:inherit}
.seg span{font-size:12px;color:var(--muted2)}
.seg.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.empty{padding:16px 14px}.empty p{margin:4px 0 0;color:var(--muted2)}

.asg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.asg label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.fa{display:flex;flex-wrap:wrap;gap:8px}
#printsheet{display:none}
@media print{
 @page{size:A4 landscape;margin:10mm}
 body{background:#fff!important;color:#000!important}
 .announce,.stage,.toast{display:none!important}
 #printsheet{display:block;font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#000;background:#fff}
 .ps h1{font-size:20px;margin:0}.ps h1 small{font-size:12px;font-weight:400;color:#444;margin-left:8px}
 .pt{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
 .st{font-weight:700;border:2px solid #000;padding:2px 10px}.st.dr{border-style:dashed}
 .ps table{width:100%;border-collapse:collapse}
 .ps th,.ps td{border:1px solid #000;padding:4px 6px;text-align:left;vertical-align:top;font-size:11px}
 .ps th{background:#eee;font-weight:700;white-space:normal;color:#000}
 .pm td span{display:block;font-size:9px;color:#444;text-transform:uppercase}.pm{margin-bottom:8px}
 .pl td.n,.pl th.n{text-align:right}.pl td.m{font-family:monospace}
 .pl .sg{width:26%}.pl td.sg{height:34px}
 .pl tr.sh td{background:#f3f3f3;font-size:12px}.pl tr.sh span{display:block;font-size:11px;font-weight:400}
 .pl tr{page-break-inside:avoid}
 .pn{font-size:9px;color:#444;margin-top:6px}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s}}
</style>

  for(const rt of routes){if(s.noloc||rt.seq.some(x=>x.noloc))continue;
   const trial=rt.seq.concat([s]);const cbm=trial.reduce((a,x)=>a+x.cbm,0);const cap=Math.min(fleetCap(trial.some(x=>x.maxH)),P.cap||1e9);if(cbm>cap+1e-9)continue;
   const seq=bestSeq(trial);const r=evalRoute(seq);if(r.late>0||r.dur>P.maxDur||(r.end>DELIV_END&&evalRoute(rt.seq).end<=DELIV_END))continue;
   const base=evalRoute(rt.seq);const sc=(r.dist-base.dist)*P.dw+(r.dur-base.dur-(r.dist-base.dist)*2.7)*P.ww;
   if(sc<bs){bs=sc;best={rt,seq}}}
  if(best&&bs<P.open)best.rt.seq=best.seq;else routes.push({seq:[s]});}

async function sapi(method,qs,body){
 const r=await fetch('/api/shiptos'+(qs||''),{method,headers:{'x-access-code':SYNC.code,'Content-Type':'application/json'},body:body?JSON.stringify(Object.assign({by:SYNC.name},body)):undefined});

 return {ok:r.ok,status:r.status,j};}
function syncFail(r){
 if(r.status===401){SYNC.status='bad';SYNC.msg='The access code was not accepted.'}
 else if(r.status===404||r.status===405){SYNC.status='none';SYNC.msg='The shared list is not set up on this copy of the page.'}
 else if(r.status===500){SYNC.status='none';SYNC.msg='The shared list is not finished setting up (storage or access code missing).'}
 else{SYNC.status='err';SYNC.msg='Could not reach the shared list. Changes are kept on this computer for now.'}}
async function syncPush(items){
 if(!SYNC.code||SYNC.status==='bad'||SYNC.status==='none')return;
 try{for(let i=0;i<items.length;i+=100){const r=await sapi('POST','',{items:items.slice(i,i+100)});if(r.ok){SYNC.status='ok';SYNC.msg=''}else{syncFail(r);break}}}catch(e){SYNC.status='err';SYNC.msg='Could not reach the shared list. Changes are kept on this computer for now.'}
 if(state.step==='shipto')render();}
async function syncPull(){
 if(!SYNC.code){SYNC.status='off';return}
 try{const r=await sapi('GET');
  if(!r.ok){syncFail(r);return}
  const rem=r.j.entries||{};let got=0;
  for(const [k,v] of Object.entries(rem)){const l=BOOK[k];if(!l||l.addr!==v.addr||l.postal!==v.postal||l.by!==v.by||l.pod!==v.pod||l.method!==v.method||l.code!==v.code){BOOK[k]=v;got++}}
  bookSave();
  const up=Object.entries(BOOK).filter(([k])=>!rem[k]).map(([k,v])=>({key:k,entry:v}));
  for(let i=0;i<up.length;i+=100){const w=await sapi('POST','',{items:up.slice(i,i+100)});if(!w.ok){syncFail(w);return}}
  SYNC.status='ok';SYNC.msg=got?`Loaded ${got} from the shared list.`:'';SYNC.n=Object.keys(BOOK).length;
 }catch(e){SYNC.status='err';SYNC.msg='Could not reach the shared list. Using this computer\'s copy.'}}
function seedBuiltIn(){

 bookSave();if(items.length)syncPush(items);return items.length;}

/* ---------- one vehicle, several trips ---------- */
const MORN_SMALL=30,MORN_BIG=90,LOAD_MIN=20,SHIFT_END=19*60,DELIV_END=17*60;
const styleP=()=>state.pstyle==='fewest'?{}:{open:20};
const lastOf=seq=>seq[seq.length-1];
const morningLoad=cbm=>480+(cbm>10?MORN_BIG:MORN_SMALL);
function assignTypes(veh){
 const left={};for(const k in state.units){const n=state.units[k];left[k]=(n===''||n==null)?Infinity:+n}
 const has=nm=>!(nm in left)||left[nm]>0;
 const take=nm=>{if(nm in left)left[nm]--};
 for(const v of veh.filter(v=>!v.unplaced).sort((a,b)=>(b.height?1:0)-(a.height?1:0)||b.cbm-a.cbm)){
  v.vt=null;v.tight=false;v.short=false;v.prime=false;
  const rg=rigidTypes().filter(t=>pv(t)>=v.cbm-1e-9&&!(v.height&&v.cbm>10));
  let pick=rg.find(t=>has(t.name));
  if(!pick&&!v.height){if(has('Prime mover'))pick=trailerTypes().find(t=>pv(t)>=v.cbm-1e-9);if(pick){v.prime=true;take('Prime mover')}}
  if(pick){if(!v.prime)take(pick.name);v.vt=pick.name+(v.prime?' with a prime mover':'');v.tight=!!(pick.cbm&&pick.kind==='rigid'&&v.cbm>pick.cbm.lo+1e-9&&pick.cbm.lo!==pick.cbm.hi);}
  else{v.short=true;v.want=vehicleNeed(v.cbm,v.height);}
 }}
function vehiclePlan(){
 const rts=state.routes.filter(r=>r.ids.length);
 const info=rts.map(rt=>{const seq=rt.ids.map(i=>S[i]);const located=seq.some(s=>!s.noloc);
  const e=evalRoute(seq);return {rt,seq,located,e,cbm:seq.reduce((a,s)=>a+s.cbm,0),height:seq.some(s=>s.maxH)}});
 const veh=[],of={};
 const mk=(x,r,v,ld)=>{const trip={rid:x.rt.id,start:r.depart,end:r.end,ld:!!ld,back:r.end+legMin(lastOf(x.seq),WH)};
  v.trips.push(trip);v.lunch=!!ld||r.lunch||r.lunchLast;v.free=trip.back+LOAD_MIN+((r.lunchLast&&!ld)?LUNCH_MIN:0);v.cbm=Math.max(v.cbm,x.cbm);v.height=v.height||x.height;of[x.rt.id]={v:v,trip};};
 for(const x of info.filter(x=>x.located).sort((a,b)=>a.e.depart-b.e.depart||a.e.end-b.e.end)){
  let best=null;
  for(const v of veh){let ld=v.lunch,md=v.free;if(!ld&&md>=LUNCH_AT){md+=LUNCH_MIN;ld=true}
   const r=evalRouteAt(x.seq,md,ld);if(r.late>1e-9)continue;
   if(r.end>DELIV_END||r.end+legMin(lastOf(x.seq),WH)>SHIFT_END)continue;
   const sc=(r.depart-v.free)+(x.cbm>v.cbm?400:0);
   if(!best||sc<best.sc)best={v,r,sc,ld}}
  if(best)mk(x,best.r,best.v,best.ld);
  else{const v={n:veh.length+1,trips:[],free:0,cbm:0,height:false,lunch:false};veh.push(v);const r0=evalRouteAt(x.seq,morningLoad(x.cbm),false);mk(x,r0.late<=1e-9?r0:x.e,v,false)}}
 for(const x of info.filter(x=>!x.located)){const v={n:veh.length+1,trips:[{rid:x.rt.id,start:null,end:null}],free:0,cbm:x.cbm,height:x.height,unplaced:true};veh.push(v);of[x.rt.id]={v,trip:v.trips[0]};}
 assignTypes(veh);
 const by={};veh.forEach(v=>v.trips.forEach((t,i)=>{by[t.rid]={n:v.n,i:i+1,of:v.trips.length,start:t.start,ld:t.ld,vt:v.vt,tight:v.tight,short:v.short,unplaced:v.unplaced}}));
 state.routes.forEach(r=>{r._v=by[r.id]||null});
 return {veh,by};}

/* try several groupings and keep the one that fits the vehicles listed best */
function planDay(stops){
 const cands=[];for(const open of [10,20,30,45])for(const cap of [0,12,10])for(const maxDur of [420,300])cands.push({open,cap,maxDur});
 let best=null;const fewest=state.pstyle==='fewest';
 for(const P of cands){
  const routes=groupRoutes(stops,P);state.routes=routes;const vp=vehiclePlan();
  const placed=vp.veh.filter(v=>!v.unplaced);
  const short=placed.filter(v=>v.short).length,prime=placed.filter(v=>v.prime).length,tight=placed.filter(v=>v.tight).length;
  let dist=0,maxDur=0,late=0;
  for(const rt of routes){const seq=rt.ids.map(i=>S[i]);if(seq.every(s=>s.noloc))continue;const e=evalRoute(seq);dist+=e.dist;maxDur=Math.max(maxDur,e.dur);if(e.end>DELIV_END)late++;}
  const sc=short*1e6+late*5e5+prime*1e5+(fewest?placed.length*1e3+dist:tight*200+dist+maxDur*0.3+placed.length*80);
  if(!best||sc<best.sc)best={sc,routes:clone(routes)};}
 state.routes=best.routes;vehiclePlan();return state.routes;}

async function dropFiles(dt){
 const out=[];
 const walk=async en=>{if(en.isFile)await new Promise(r=>en.file(f=>{out.push(f);r()},r));else if(en.isDirectory){const rd=en.createReader();let batch;do{batch=await new Promise(r=>rd.readEntries(r,()=>r([])));for(const c of batch)await walk(c)}while(batch.length)}};
 if(dt.items&&dt.items.length&&dt.items[0].webkitGetAsEntry){const ents=[...dt.items].map(i=>i.webkitGetAsEntry()).filter(Boolean);for(const en of ents)await walk(en)}
 if(!out.length)out.push(...dt.files);
 return out;}

function analyse(rt){
 const seq=rt.ids.map(i=>S[i]);const e=evalRouteAt(seq,rt._v&&rt._v.start!=null?rt._v.start:0,rt._v&&rt._v.ld);const cbm=seq.reduce((a,s)=>a+s.cbm,0);

 e.legs.filter(l=>l.late>0&&!l.stop.noloc).forEach(l=>why.push(l.stop.name+' arrives '+Math.round(l.late)+' min late'));
 if(!need)why.push(height?'Over '+fleetCap(true)+' m³ with a 2.6 m height limit':'Over '+fleetCap(false)+' m³ and no trailer fits: split into 2 trips');
 return {seq,e,cbm,need,why};}

 const ranged=fl.types.filter(t=>t.cbm&&t.cbm.lo!==t.cbm.hi);
 m.push({t:'This is the vehicle types sheet you sent. I use it to decide which vehicle a route needs and how big a route can be before it must be split.'});
 if(ranged.length)m.push({t:`You gave ranges for ${ranged.map(t=>t.name+' ('+rng(t.cbm)+')').join(', ')}. Today I plan the 24 footer up to ${pvOf('24 footer','hi')} m³ and mark loads above ${pvOf('24 footer','lo')} m³ as a tight fit, where a van may need to follow. You can switch to the lower figure in the sizing choice.`});
 if(miss.length)m.push({t:`No m³ yet for ${miss.join(', ')}. I leave these out of planning and do not guess.`});
 m.push({t:'No pallet counts are filled in. Orders are sized in m³ today, so pallets are stored but not used yet. If a customer ships by pallets, say so and I will plan on pallets for that customer.'});
 if(!fl.vehicles.length)m.push({t:'There are no plate numbers in the Fleet List, so I cannot tell how many of each type you own. A route may ask for a 24 footer when you have none free.'});
 m.push({t:'AC trucks are not used in planning, because the orders do not say which goods need chilling. Tell me how that should work and I will add it.'});
 return m;}
 function shiptoNotes(){
 const n=Object.keys(BOOK).length,m=[];
 m.push({t:'Every address you save while approving a route is kept here by customer and ship-to name. The next order for the same pair fills in by itself.'});
 m.push({t:SYNC.status==='ok'?'You are connected to the shared list. Addresses saved by any manager appear for everyone after they refresh or reopen the page.':'You are not connected to the shared list yet, so addresses are kept on this computer only. Enter your name and the access code above to connect.'});
 m.push({t:'The order text still wins. If an order carries a different address, I show it for you to confirm and the list is updated.'});
 m.push({t:'When you build routes, each saved postal code or address is turned into a map position by the shared-list function, and the position is saved with the entry. This needs the connection above.'});
 if(!bookOk)m.push({t:'This browser is not letting the page save anything (private window or blocked site data), so the list will be lost when you close the tab. Use Download to keep it.'});
 if(n)m.push({t:'The list is saved in this browser only. To share it with other managers, download it and put it in a shared folder, and they can load it here.'});
 return m;}
function notes(){
 if(state.step==='shipto')return shiptoNotes();
 if(state.step==='fleet')return fleetNotes();
 const m=[];
 if(state.step==='orders'){
  const sm=summary();const bad=state.files.filter(f=>f.status==='bad');
  m.push({t:'Add the delivery summaries for the day. Today I can read the GroupeSeb Open Items List. Other customers need a converter, which starts from one sample file each.'});
  if(sm.ok.length)m.push({t:`Read ${plural(sm.orders,'order')} across ${plural(sm.stops.length,'stop')}.${sm.fresh?` ${plural(sm.fresh,'ship-to')} not on the master list will need an address before their route can be approved.`:''}`,a:[{l:'Build routes',act:'build'}]});
  if(bad.length)m.push({t:`I could not read ${bad.length===1?bad[0].name:plural(bad.length,'file')}. ${bad[0].msg}`});
  if(sm.dates.length>1)m.push({t:'These files cover more than one delivery date. I would route them together, so check that is what you want.'});
  return m;}
 const rts=state.routes,stops=allStops();
 const pend=stops.reduce((a,s)=>a+pendingFlags(s).length,0);
 m.push({t:`${plural(stops.length,'stop')} became ${plural(rts.length,'trip')} on ${plural(state.vp?state.vp.veh.length:rts.length,'vehicle')} by area and time window. ${pend?`${plural(pend,'item')} need a person before the routes can be approved.`:'Nothing is blocking approval.'}`});
 for(const r of rts){const a=analyse(r);if(!a.why.length||state.approved[r.id])continue;
  const fix=a.seq.filter(s=>pendingFlags(s).length);
  m.push({t:`Route ${r.n} cannot be approved yet: ${a.why.join('; ')}.`,a:fix.slice(0,3).map(s=>({l:'Fix '+s.name.replace(/^Best Denki /,''),act:'jump',id:s.id}))});}
 for(const r of rts){const a=analyse(r);const lg=a.e.legs.find(l=>l.stop.win&&l.stop.win[0]!=null&&Math.abs(l.eta-l.stop.win[0])<1);
  if(lg&&a.e.depart>=DEPART+30&&!lg.stop.noloc)m.push({t:`Route ${r.n} is set to leave at ${fmt(a.e.depart)} so it reaches ${lg.stop.name} as its slot opens at ${fmt(lg.stop.win[0])}. Its other stops could be delivered earlier, so you may prefer a morning start.`});}
 const cf=stops.filter(s=>s.flags.includes('conflict'));
 if(cf.length)m.push({t:`${cf.map(s=>s.name.replace(/ Electronics.*$/,'').replace(/^Best Denki /,'')).join(' and ')}: the order text and the master list disagree. I followed the order, as your team does.`});
 if(stops.some(s=>s.noloc))m.push({t:`${stops.filter(s=>s.noloc).map(s=>s.name).join(', ')} ${stops.filter(s=>s.noloc).length===1?'has':'have'} no location on file, so no arrival time is estimated for ${stops.filter(s=>s.noloc).length===1?'it':'them'}.`});
 if(rts.length&&rts.every(r=>state.approved[r.id]))m.push({t:'All routes are approved. Matching vehicles and drivers comes next and stays manual for now.'});
 return m;}
function renderAssist(){
 const feed=notes().map(x=>`<div class="msg"><p class="t">${esc(x.t)}</p>${x.a&&x.a.length?`<div class="acts2">${x.a.map(b=>`<button class="act" data-act="${b.act}"${b.id?` data-id="${b.id}"`:''}>${esc(b.l)}</button>`).join('')}</div>`:''}</div>`).join('');
 return `<div class="ah">Claude's notes<small>${{fleet:'Fleet',orders:'Orders',shipto:'Ship-tos',routes:'Routes'}[state.step]}</small></div><div class="feed">${feed}</div><div class="ask"><b>Ask Claude about a route…</b>Not live in this prototype.</div>`;}

/* ---------- shell ---------- */
function render(){
 if(state.step==='routes'&&state.routes.length)state.vp=vehiclePlan();
 document.getElementById('side').innerHTML=renderSide();
 document.getElementById('topbar').innerHTML=renderTop();
 document.getElementById('tabs').innerHTML=renderTabs();
 document.getElementById('work').innerHTML=state.step==='fleet'?renderFleet():state.step==='orders'?renderUpload():state.step==='shipto'?renderShipto():renderRoutes();
 document.getElementById('assist').innerHTML=renderAssist();
 if(state.step==='orders')wireDrop();
 if(state.step==='fleet')wireFleet();
 if(state.step==='shipto')wireShipto();
 wireSearch();}
function wireDrop(){
 const d=document.getElementById('drop');if(!d)return;
 d.addEventListener('dragover',e=>{e.preventDefault();if(!state.over){state.over=true;d.classList.add('over')}});
 d.addEventListener('dragleave',e=>{if(e.target===d){state.over=false;d.classList.remove('over')}});
 d.addEventListener('drop',async e=>{e.preventDefault();state.over=false;d.classList.remove('over');addFiles(await dropFiles(e.dataTransfer))});
 document.getElementById('fi').addEventListener('change',e=>{addFiles(e.target.files);e.target.value=''});
 document.getElementById('fd').addEventListener('change',e=>{addFiles(e.target.files);e.target.value=''});}
function addrText(s){
 const a=state.resolved[key(s.id,'noaddr')],p=state.resolved[key(s.id,'postal')];
 if(a&&a.text)return a.text;
 if(p&&p.text)return s.addr.replace(/\s*\(postal code 0 on master\)/,'')+', S('+p.text+')';
 if(s.addrSrc==='missing')return 'ADDRESS NEEDED';
 return s.addr;}
function printRoute(id){
 const rt=state.routes.find(r=>r.id===id);if(!rt)return;
 const a=analyse(rt);const as=state.assign[id]||{};const appr=!!state.approved[id];
 const date=state.dateLabel||'';
 let body='';
 a.e.legs.forEach((l,i)=>{const s=l.stop;const os=ORDERS[s.id]||[];
  body+=`<tr class="sh"><td colspan="6"><b>${i+1}. ${esc(s.name)}</b><span>${esc(addrText(s))}</span><span>Window: ${esc(winText(s))} &nbsp; Expected arrival: ${s.noloc?'not estimated':fmt(l.eta)}${s.maxH?' &nbsp; Max height '+s.maxH+' m':''}</span></td></tr>`;
  {const be=bookGet(s.cust,s.name,s.code);if(be&&(be.method||be.pod))body+=`<tr class="sh"><td colspan="6" style="font-weight:400"><b>Delivery rules:</b> ${be.method?esc(be.method).replace(/\n/g,'<br>'):''}${be.method&&be.pod?'<br>':''}${be.pod?'<b>POD:</b> '+esc(be.pod).replace(/\n/g,'<br>'):''}</td></tr>`;}
  os.forEach(o=>{body+=`<tr><td>${esc(o.cust||'')}</td><td class="m">${esc(o.doc)}</td><td class="n">${o.qty}</td><td class="n">${o.cbm.toFixed(3)}</td><td>${o.type==='Collection'?'<b>COLLECT. </b>':''}${esc(o.remarks)}</td><td class="sg"></td></tr>`;});});
 const html=`<div class="ps"><div class="pt"><h1>Route ${rt.n} <small>${esc(rt.label)}</small></h1><div class="st ${appr?'ok':'dr'}">${appr?'APPROVED':'DRAFT, NOT APPROVED'}</div></div>
 <table class="pm"><tr><td><span>Delivery date</span>${esc(date)||'&nbsp;'}</td><td><span>Vehicle${rt._v&&!rt._v.unplaced?' '+rt._v.n+(rt._v.of>1?', trip '+rt._v.i+' of '+rt._v.of:''):''}</span>${esc(as.veh||'')||'&nbsp;'}</td><td><span>Driver</span>${esc(as.drv||'')||'&nbsp;'}</td><td><span>Stops</span>${a.seq.length}</td><td><span>Volume</span>${m3(a.cbm)} m³</td><td><span>Leaves / back (est.)</span>${a.seq.every(s=>s.noloc)?'not estimated':fmt(a.e.depart)+' / '+fmt(a.e.end)}</td></tr></table>
 <table class="pl"><thead><tr><th>Customer</th><th>Doc. no.</th><th class="n">Qty</th><th class="n">m³</th><th>Remarks as sent</th><th class="sg">Received by / signature / stamp</th></tr></thead><tbody>${body}</tbody></table>
 <p class="pn">Arrival times are estimates from a prototype and are not traffic-checked. Follow the order remarks where they differ.</p></div>`;
 const el=document.getElementById('printsheet');el.innerHTML=html;
 const clear=()=>{el.innerHTML='';window.removeEventListener('afterprint',clear)};window.addEventListener('afterprint',clear);
 setTimeout(()=>window.print(),50);}
document.addEventListener('input',ev=>{const t=ev.target.closest('input[data-asg]');if(!t)return;const id=t.dataset.asg;state.assign[id]=Object.assign(state.assign[id]||{},{[t.dataset.k]:t.value});
 const rt=state.routes.find(r=>r.id===id);if(rt&&rt._v&&rt._v.of>1)state.routes.filter(r=>r.id!==id&&r._v&&r._v.n===rt._v.n).forEach(r=>{state.assign[r.id]=Object.assign(state.assign[r.id]||{},{[t.dataset.k]:t.value});const el=document.querySelector('input[data-asg="'+r.id+'"][data-k="'+t.dataset.k+'"]');if(el)el.value=t.value;});});
document.addEventListener('change',ev=>{const t=ev.target;if(t&&t.dataset&&t.dataset.unit){state.units[t.dataset.unit]=t.value.replace(/\D/g,'');render();}});
document.addEventListener('change',ev=>{const t=ev.target;
 if(t&&t.id==='pstyle'){state.pstyle=t.value;const ok=!Object.keys(state.approved).some(k=>state.approved[k])||confirm('Re-planning will undo the routes you approved and any stops you moved. Continue?');
  if(!ok){render();return}
  state.routes=planDay(Object.values(S));INITIAL=clone(state.routes);state.next=state.routes.length+1;state.approved={};render();}});
function wireFleet(){
 const ff=document.getElementById('ff'),pf=document.getElementById('pf');if(!ff)return;
 ff.addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=await readFleetFile(f);if(r.error){state.fleetMsg=r.error;render();return}
  r.fleet.source=f.name;state.fleet=r.fleet;state.fleetMsg='';state.routes=[];state.approved={};toast('Fleet list read: '+plural(r.fleet.types.length,'type')+', '+plural(r.fleet.vehicles.length,'vehicle')+'.');render();});
 pf.addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f||!state.photoFor)return;
  const rd=new FileReader();rd.onload=()=>{state.photos[state.photoFor]=rd.result;render()};rd.readAsDataURL(f);});}
function wireSearch(){
 const q=document.getElementById('ordq');if(!q)return;
 q.addEventListener('input',()=>{state.q=q.value;const r=ordersRowsHtml(summary());document.getElementById('ordbody').innerHTML=r.html;document.getElementById('ordcount').textContent=r.n===r.total?plural(r.total,'order'):r.n+' of '+r.total;});}
function sequence(rt){rt.ids=bestSeq(rt.ids.map(i=>S[i])).map(s=>s.id)}
function scrollToStop(id){const el=document.querySelector('[data-row="'+id+'"]');if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'})}
document.addEventListener('click',ev=>{
 const t=ev.target.closest('[data-act]');if(!t||t.disabled)return;const a=t.dataset.act;
 if(a==='pick')document.getElementById('fi').click();
 else if(a==='pickdir')document.getElementById('fd').click();
 else if(a==='remove'){state.files.splice(+t.dataset.i,1);render()}
 else if(a==='build')build();
 else if(a==='goto'){if(t.dataset.v==='routes'&&!state.routes.length)return;state.step=t.dataset.v;render()}
 else if(a==='pickfleet')document.getElementById('ff').click()
 else if(a==='fleetreset'){state.fleet=fleetFromRaw(FLEET_DEFAULT);state.fleetMsg='';toast('Back to the 7 Oct fleet file.');render()}
 else if(a==='plan'){const had=state.routes.length;state.plan=t.dataset.v;state.routes=[];state.approved={};render();toast(had?'Planning basis changed. Build the routes again from Delivery orders.':'Planning basis changed.')}
 else if(a==='photo'){state.photoFor=state.fleet.types[+t.dataset.t].name;document.getElementById('pf').click()}
 else if(a==='newday'){state.files=[];state.routes=[];state.approved={};state.resolved={};state.open=null;state.orders={};state.assign={};state.step='orders';render()}
 else if(a==='open'){state.open=state.open===t.dataset.id?null:t.dataset.id;render()}
 else if(a==='jump'){state.open=t.dataset.id;render();scrollToStop(t.dataset.id)}
 else if(a==='orders'){state.orders[t.dataset.id]=!state.orders[t.dataset.id];render()}
 else if(a==='resolve'){const id=t.dataset.id,f=t.dataset.f;let val={};
  if(t.dataset.input){const v=document.getElementById(t.dataset.input).value.trim();if(!v){toast('Enter a value first.');return}val.text=v}
  if(t.dataset.radio){const r=document.querySelector('input[name="'+t.dataset.radio+'"]:checked');val.choice=r?r.value:'order'}
  state.resolved[key(id,f)]=Object.assign({ok:true},val);if(!pendingFlags(S[id]).length)state.open=null;
  let saved=null;{const s=S[id];if(f==='noaddr')saved=bookPut(s.cust,s.name,Object.assign({addr:val.text||s.addr},s.code?{code:String(s.code)}:{}));else if(f==='postal'&&val.text)saved=bookPut(s.cust,s.name,Object.assign({postal:val.text},s.code?{code:String(s.code)}:{}));}
  toast(saved===true?'Confirmed and saved to the Ship-to list.':saved===false?'Confirmed, but this browser would not save it for next time.':'Confirmed.');render()}
 else if(a==='confirmall'){let n=0;for(const s of allStops()){if(s.flags.includes('noaddr')&&s.addrSrc==='order'&&!state.resolved[key(s.id,'noaddr')]&&!s.flags.includes('conflict')){state.resolved[key(s.id,'noaddr')]={ok:true,text:s.addr};bookPut(s.cust,s.name,Object.assign({addr:s.addr},s.code?{code:String(s.code)}:{}));n++}}toast(n+' addresses confirmed and saved to the Ship-to list.');render()}
 else if(a==='dlbook'){bookDownload()}
 else if(a==='pickbook'){document.getElementById('bf').click()}
 else if(a==='pickbp'){document.getElementById('bpf').click()}
 else if(a==='delbook'){delete BOOK[t.dataset.k];bookSave();if(SYNC.code&&SYNC.status==='ok')sapi('DELETE','?key='+encodeURIComponent(t.dataset.k),{}).catch(()=>{});render()}
 else if(a==='syncconnect'){SYNC.name=document.getElementById('sname').value.trim();SYNC.code=document.getElementById('scode').value.trim();if(!SYNC.name||!SYNC.code){SYNC.msg='Enter your name and the access code.';SYNC.status=SYNC.code?SYNC.status:'off';render();return}syncKeep();SYNC.status='wait';render();syncPull().then(()=>{syncKeep();render();toast(SYNC.status==='ok'?'Connected to the shared list.':SYNC.msg||'Not connected.')})}
 else if(a==='syncrefresh'){SYNC.status='wait';render();syncPull().then(()=>{render();toast(SYNC.status==='ok'?'Shared list refreshed.':SYNC.msg||'Not connected.')})}
 else if(a==='syncseed'){const n=seedBuiltIn();toast(n?`Added ${n} GroupeSeb addresses${SYNC.status==='ok'?' to the shared list':''}.`:'The built-in addresses are already in the list.');render()}
 else if(a==='syncoff'){SYNC.code='';SYNC.status='off';SYNC.msg='';syncKeep();render()}
 else if(a==='printroute'){printRoute(t.dataset.id)}
 else if(a==='approve'){state.approved[t.dataset.id]=true;render()}
 else if(a==='undo'){delete state.approved[t.dataset.id];render()}
 else if(a==='approveall'){let n=0;state.routes.forEach(r=>{if(!state.approved[r.id]&&!analyse(r).why.length){state.approved[r.id]=true;n++}});const left=state.routes.filter(r=>!state.approved[r.id]).length;toast(n?plural(n,'route')+' approved.'+(left?' '+left+' still need attention.':''):'No route is ready yet. Confirm the flagged items first.');render()}
 else if(a==='reset'){state.routes=clone(INITIAL);state.approved={};state.next=INITIAL.length+1;toast('Routes reset.');render()}
});
document.addEventListener('change',ev=>{
 const t=ev.target.closest('select[data-act=move]');if(!t)return;const rts=state.routes;
 const id=t.dataset.id,from=rts.find(r=>r.id===t.dataset.from);let to;
 if(t.value==='NEW'){const n=Math.max(0,...rts.map(r=>r.n))+1;to={id:'R'+(state.next++),n,label:'New route',ids:[]};rts.push(to)}else to=rts.find(r=>r.id===t.value);
 if(!to||to===from){render();return}
 from.ids=from.ids.filter(x=>x!==id);to.ids.push(id);sequence(to);if(from.ids.length)sequence(from);
 delete state.approved[from.id];delete state.approved[to.id];
 if(!from.ids.length)state.routes=rts.filter(r=>r!==from);
 toast('Moved. Route '+to.n+(from.ids.length?' and Route '+from.n:'')+' need approving again.');render()});
state.fleet=fleetFromRaw(FLEET_DEFAULT);
render();
if(SYNC.code)syncPull().then(()=>render());

</script>
